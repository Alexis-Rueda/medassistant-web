<form [formGroup]="form" (ngSubmit)="handleSubmit()"
  class="flex flex-row items-center h-16 rounded-xl w-full px-4">

  <div class="grow">
    <div class="joins relative w-full">
      <input type="text" autofocus
        class="input join-item flex w-full border rounded-xl  focus:outline-none focus:input-info pl-4 h-10"
        [placeholder]="placeholder" formControlName="prompt" [autocomplete]=" disableCorrections ? 'on':'off'"
        [spellcheck]=" disableCorrections ? 'on':'off'" />
    </div>
  </div>

  <div class="ml-4">
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Enviar</button>
  </div>

</form>
