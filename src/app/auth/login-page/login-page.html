<h1 class="text-2xl font-semibold mb-4">Login</h1>

@if (authenticated()) {
  <button
    class="btn w-80 bg-black text-white border-black mt-2"
    (click)="continueToApp()"
  >
    Continue to app
  </button>
  <button
    class="btn w-80 mt-2"
    (click)="switchAccount()"
  >
    Switch account
  </button>
} @else {
  <button
    class="btn w-80 bg-black text-white border-black mt-2"
    (click)="login()"
  >
    Sign In with SSO
  </button>
}
